name: CI

# Staging = shiinbii (auto via push/PR)
# Production = production (manual push dari operator, TIDAK ter-trigger dari shiinbii)
# Tiap push ke 1 branch hanya menjalankan CI untuk branch itu sendiri —
# tidak ada step yang memindahkan kode antar branch.
on:
  push:
    branches: [shiinbii, production]
  pull_request:
    branches: [shiinbii, production]

jobs:
  typecheck:
    name: Typecheck & Lint (${{ github.ref_name }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Lint (non-blocking)
        run: npx next lint --dir src || echo "lint finished"
